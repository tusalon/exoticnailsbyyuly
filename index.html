    <!-- Script para service worker (VERSIÓN DINÁMICA) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // Detectar la ruta base automáticamente
                const pathSegments = window.location.pathname.split('/');
                const basePath = pathSegments.length > 2 ? '/' + pathSegments[1] : '';
                const swPath = basePath ? `${basePath}/sw.js` : '/sw.js';
                
                console.log('🔄 🔄 Registrando Service Worker en:', swPath);
                
                navigator.serviceWorker.register(swPath)
                    .then(registration => {
                        console.log('✅ ✅ Service Worker registrado:', registration.scope);
                    })
                    .catch(error => {
                        console.log('❌ ❌ Error registrando Service Worker:', error);
                    });
            });
        }
    </script>

    <script>
        // Actualizar título dinámico desde la base de datos
        (async function() {
            try {
                const nombre = await window.getNombreNegocio();
                if (nombre) {
                    document.title = `${nombre} - Reserva de Turnos`;
                    document.querySelector('meta[name="apple-mobile-web-app-title"]')?.setAttribute('content', nombre.split(' ')[0] || 'Exotic');
                }
            } catch (error) {
                console.error('Error cargando título:', error);
            }
        })();
    </script>
    
    <script>
        // Forzar prompt de instalación PWA
        window.addEventListener('load', () => {
            if (window.matchMedia('(display-mode: standalone)').matches) {
                console.log('📱 📱 App ya instalada');
                return;
            }

            let deferredPrompt;
            
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                console.log('✅ ✅ beforeinstallprompt listo');
                
                const btn = document.createElement('button');
                btn.innerText = '📲 📱 INSTALAR APP';
                btn.style.position = 'fixed';
                btn.style.bottom = '20px';
                btn.style.right = '20px';
                btn.style.zIndex = '9999';
                btn.style.background = '#ec4899';
                btn.style.color = 'white';
                btn.style.padding = '15px 30px';
                btn.style.borderRadius = '50px';
                btn.style.border = 'none';
                btn.style.fontWeight = 'bold';
                btn.style.boxShadow = '0 4px 15px rgba(0,0,0,0.3)';
                btn.style.cursor = 'pointer';
                
                btn.onclick = async () => {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    console.log(`✅ ✅ Usuario: ${outcome}`);
                    deferredPrompt = null;
                    btn.remove();
                };
                
                document.body.appendChild(btn);
            });

            setTimeout(() => {
                if (!deferredPrompt && !window.matchMedia('(display-mode: standalone)').matches) {
                    const msg = document.createElement('div');
                    msg.innerHTML = '📱 📱 Para instalar: menú 3 puntos → "Instalar aplicación"';
                    msg.style.position = 'fixed';
                    msg.style.bottom = '20px';
                    msg.style.left = '20px';
                    msg.style.background = '#333';
                    msg.style.color = 'white';
                    msg.style.padding = '10px 20px';
                    msg.style.borderRadius = '10px';
                    msg.style.fontSize = '14px';
                    msg.style.zIndex = '9999';
                    document.body.appendChild(msg);
                    
                    setTimeout(() => msg.remove(), 8000);
                }
            }, 5000);
        });
    </script>
